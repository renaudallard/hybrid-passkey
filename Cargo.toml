[package]
name = "hybrid-passkey"
version = "0.1.0"
description = "Native messaging helper that answers passkey requests of Thunderbird and Firefox add-ons with a passkey on a phone"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
libwebauthn = "=0.11.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde_json = "1.0.141"
tokio = { version = "1.45", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
